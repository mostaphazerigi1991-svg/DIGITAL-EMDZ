<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIGITAL EMDZ — Admin</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><header class="glass"><a class="logo" href="index.html">DIGITAL <span>EMDZ</span></a><a class="admin" href="index.html">العودة للمتجر</a></header><main class="section"><p class="eyebrow">ADMIN DASHBOARD</p><h1>إدارة المتجر</h1><div class="admin-grid"><section class="panel glass"><h2>إضافة منتج</h2><form id="productForm"><input name="name" placeholder="اسم المنتج" required><textarea name="description" placeholder="وصف المنتج"></textarea><div class="two"><input name="price" type="number" step="0.01" placeholder="السعر USD" required><input name="oldPrice" type="number" step="0.01" placeholder="السعر القديم"></div><select name="category"><option>Templates</option><option>Planners</option><option>Ebooks</option><option>Digital Tools</option><option>Bundles</option><option>Other Digital Products</option></select><label>صورة المنتج <input name="image" type="file" accept="image/*"></label><label>الملف الرقمي <input name="file" type="file" accept=".pdf,.zip,.png,.jpg,.jpeg,.xlsx,.docx"></label><button class="btn primary" type="submit">إضافة المنتج</button></form><p class="muted">بعد ربط Firebase سيتم حفظ الصورة والملف في Storage وسجل المنتج في Firestore.</p></section><section class="panel glass"><h2>وسائل الدفع</h2><div id="payments"><div class="payment">BaridiMob</div><div class="payment">CCP</div><div class="payment">CIB</div><div class="payment">Binance</div><div class="payment">RedotPay</div><div class="payment">PayPal</div></div><button class="btn ghost" id="addPayment">+ إضافة وسيلة دفع</button></section><section class="panel glass"><h2>إعدادات المتجر</h2><input placeholder="اسم المتجر" value="DIGITAL EMDZ"><input placeholder="رقم واتساب" value="+213770913494"><input placeholder="إيميل الدعم" value="digitalemdz@gmail.com"><select><option>USD — الدولار الأمريكي</option></select><button class="btn primary">حفظ الإعدادات</button></section></div></main><script type="module" src="js/admin.js"></script></body></html>
