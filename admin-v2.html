<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIGITAL EMDZ — الإدارة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/store-v2.css"><style>.admin-wrap{max-width:1100px;margin:auto;padding:70px 20px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:24px;border-radius:24px}.panel form,.panel{display:flex;flex-direction:column;gap:12px}.panel input,.panel textarea,.panel select{width:100%;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:12px;padding:12px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#94a3b8;font-size:13px}.product-admin-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.admin-product-main{display:flex;align-items:center;gap:12px}.admin-product-main img,.no-thumb{width:58px;height:58px;object-fit:cover;border-radius:12px;background:#172554;display:grid;place-items:center}.payment-admin-actions{display:flex;gap:6px;margin-top:10px}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.product-admin-row{align-items:flex-start;flex-direction:column}}</style></head><body><header class="glass"><a class="logo" href="index.html">DIGITAL <span>EMDZ</span></a><a class="admin" href="index.html">العودة للمتجر</a></header><main class="admin-wrap"><section id="loginPanel" class="panel glass"><p class="eyebrow">SECURE ADMIN</p><h1>دخول الإدارة</h1><p class="muted">سجّل الدخول بحساب المدير في Firebase.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" required><input id="loginPassword" type="password" placeholder="كلمة المرور" required><button class="btn primary" type="submit">تسجيل الدخول</button></form><p id="loginMessage" class="muted"></p></section><section id="dashboard" hidden><div class="section-head"><div><p class="eyebrow">ADMIN DASHBOARD</p><h1>إدارة المتجر</h1><p id="adminEmail" class="muted"></p></div><button id="logoutBtn" class="btn ghost">تسجيل الخروج</button></div><div class="admin-grid"><section class="panel glass"><h2>إضافة منتج</h2><form id="productForm"><input name="name" placeholder="اسم المنتج" required><textarea name="description" placeholder="وصف المنتج" rows="4"></textarea><div class="two"><input name="price" type="number" min="0" step="0.01" placeholder="السعر USD" required><input name="oldPrice" type="number" min="0" step="0.01" placeholder="السعر القديم"></div><select name="category"><option>Templates</option><option>Planners</option><option>Ebooks</option><option>Digital Tools</option><option>Bundles</option><option>Other Digital Products</option></select><label>رفع صورة المنتج <input name="image" type="file" accept="image/*"></label><input name="imageUrl" type="url" placeholder="أو ضع رابط الصورة"><label>الملف الرقمي <input name="file" type="file" accept=".pdf,.zip,.png,.jpg,.jpeg,.xlsx,.docx"></label><p class="muted">الصورة تُضغط تلقائيًا وتحفظ مع المنتج بدون Storage. رفع ملفات المنتجات الرقمية يحتاج Storage أو حل تخزين خارجي.</p><button class="btn primary" type="submit">حفظ المنتج</button></form><p id="productMessage" class="muted"></p></section><section class="panel glass"><h2>المنتجات الحالية</h2><div id="productsList"></div></section><section class="panel glass"><h2>وسائل الدفع</h2><div id="payments"></div><button class="btn ghost" id="addPayment">+ إضافة وسيلة دفع</button></section><section class="panel glass"><h2>إعدادات المتجر</h2><form id="settingsForm"><input name="storeName" placeholder="اسم المتجر" value="DIGITAL EMDZ"><input name="whatsapp" placeholder="رقم واتساب" value="+213770913494"><input name="email" type="email" placeholder="إيميل الدعم" value="digitalemdz@gmail.com"><input name="currency" value="USD" readonly><button class="btn primary">حفظ الإعدادات</button></form><p id="settingsMessage" class="muted"></p></section></div></section></main><script type="module" src="js/admin-v2.js"></script></body></html>
